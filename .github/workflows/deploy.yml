name: Deploy Website

# 'on' defines WHAT triggers the automation (e.g., a push to main)
on:
  push:
    branches:
      - main
  workflow_dispatch: # This line enables the manual "Run workflow" button

# 'jobs' defines WHERE and HOW the work happens
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "this-text-is-ignored-by-the-server" # The server runs deploy.sh instead

